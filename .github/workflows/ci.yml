name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install pyflakes
      - run: python -m pyflakes codex_os3 tests bench
      - run: python -m unittest discover -s tests -v
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S error install.sh app/macos/build.sh
      - name: install with the fake codex (cron path), chat, reload, uninstall
        run: |
          sudo install -m 755 tests/fake_codex/codex.py /usr/local/bin/codex
          CODEX_OS3_SRC=$PWD bash install.sh --no-wait
          cd ~/.codex-os3/app && python3 -m codex_os3 status | grep "service: running"
          python3 -m codex_os3 reload
          python3 -m codex_os3 verify || true   # what the running service sees (Codex, sign-in, Claude)
          # installing again over the running router (an upgrade) keeps it running and leaves no rollback copy behind
          CODEX_OS3_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/install.sh" --no-wait
          python3 -m codex_os3 status | grep "service: running"
          test ! -d ~/.codex-os3/app.old
          cd - && bash install.sh --uninstall --purge
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          foreach ($f in "install.ps1", "app/windows/tray.ps1", "app/windows/open-app.ps1", "app/windows/shortcut.ps1") {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Error "${f}: $_" }; exit 1 }
          }
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install with the fake codex, chat, reload, uninstall
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP "bin"; New-Item -ItemType Directory $bin | Out-Null
          Copy-Item tests/fake_codex/codex.py $bin
          Set-Content (Join-Path $bin "codex.cmd") "@echo off`r`npython `"%~dp0codex.py`" %*"
          $env:PATH = "$bin;$env:PATH"
          $env:CODEX_OS3_SRC = $PWD.Path
          ./install.ps1 -NoTray -NoWait
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "install failed" }
          $lnk = Join-Path ([Environment]::GetFolderPath("Programs")) "OS3 Router.lnk"
          if (-not (Test-Path $lnk)) { throw "no Start menu entry" }
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          Write-Host "Start menu entry: $($sc.TargetPath) $($sc.Arguments)"
          if ($sc.Arguments -notlike "*--app=http://localhost:*/app*" -and $sc.Arguments -notlike "*open-app.ps1*") { throw "shortcut doesn't open the app" }
          $cfg = Get-Content "$env:USERPROFILE/.codex-os3/config.json" -Raw | ConvertFrom-Json
          if (-not $cfg.port) { $cfg | Add-Member port 11435 -Force }
          $h = @{ Authorization = "Bearer $($cfg.api_key)" }
          $body = '{"messages":[{"role":"user","content":"hi"}]}'
          try { $r = Invoke-RestMethod "http://127.0.0.1:$($cfg.port)/v1/chat/completions" -Method Post -Headers $h -Body $body -ContentType "application/json" }
          catch {
            Write-Host "BODY: $($_.ErrorDetails.Message)"
            Get-CimInstance Win32_Process -Filter "Name like 'python%'" | Select-Object ProcessId, CommandLine | Format-List | Out-String | Write-Host
            Get-Content "$env:USERPROFILE/.codex-os3/service.log" -ErrorAction SilentlyContinue
            throw
          }
          if ($r.choices[0].message.content -notlike "*fake codex*") { throw "chat failed: $($r | ConvertTo-Json -Depth 5)" }
          $before = (Invoke-RestMethod "http://127.0.0.1:$($cfg.port)/health").pid
          Push-Location "$env:USERPROFILE/.codex-os3/app"; python -m codex_os3 reload; Pop-Location
          $after = $before
          for ($i = 0; $i -lt 60 -and $after -eq $before; $i++) {
            Start-Sleep 1
            try { $after = (Invoke-RestMethod "http://127.0.0.1:$($cfg.port)/health" -TimeoutSec 2).pid } catch {}
          }
          if ($after -eq $before) { Get-Content "$env:USERPROFILE/.codex-os3/service.log"; throw "reload did not swap the worker" }
          # installing again over the running router (an upgrade): the new files go over the old folder, which the
          # running router holds as its working directory; nothing nested, no rollback copy left, still answering
          ./install.ps1 -NoTray -NoWait
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "upgrade failed" }
          $appdir = "$env:USERPROFILE/.codex-os3/app"
          if (Test-Path "$appdir/app.new") { throw "upgrade nested the new version inside the old folder" }
          if (-not (Test-Path "$appdir/codex_os3/__init__.py")) { throw "upgrade left no router" }
          if (Test-Path "$appdir.old") { throw "rollback copy was not cleaned up" }
          Invoke-RestMethod "http://127.0.0.1:$($cfg.port)/health" -TimeoutSec 5 | Out-Null
          Push-Location $appdir; python -m codex_os3 verify; Pop-Location
          ./install.ps1 -Uninstall -Purge
          Start-Sleep 3
          try { Invoke-RestMethod "http://127.0.0.1:$($cfg.port)/health" -TimeoutSec 2; throw "still running after uninstall" } catch { if ($_.Exception.Message -like "*still running*") { throw } }
  macos-installer:
    # install.sh's launchd branch (what most Mac users run) had no test at all: the Linux job covers cron only
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo install -m 755 tests/fake_codex/codex.py /usr/local/bin/codex
          CODEX_OS3_SRC=$PWD bash install.sh --no-wait --no-app
          launchctl print "gui/$(id -u)/ai.codexos3.router" | head -12
          cd ~/.codex-os3/app && python3 -m codex_os3 status | grep "service: running"
          python3 -m codex_os3 verify || true
          CODEX_OS3_SRC="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/install.sh" --no-wait --no-app
          python3 -m codex_os3 status | grep "service: running"
          test ! -d ~/.codex-os3/app.old
          bash "$GITHUB_WORKSPACE/install.sh" --uninstall --purge
  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: app/macos/build.sh
